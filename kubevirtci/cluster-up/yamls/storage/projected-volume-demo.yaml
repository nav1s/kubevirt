apiVersion: v1
kind: Pod
metadata:
  name: projected-volume-demo
  labels:
    app: demo
spec:
  containers:
  - name: app
    image: busybox:1.28
    command: ['sh', '-c', 'ls -la /projected && cat /projected/username && echo && cat /projected/labels && sleep 3600']
    volumeMounts:
    - name: all-in-one
      mountPath: /projected
      readOnly: true
  volumes:
  - name: all-in-one
    projected:
      sources:
      - secret:
          name: db-credentials
          items:
          - key: username
            path: username
      - downwardAPI:
          items:
          - path: labels
            fieldRef:
              fieldPath: metadata.labels
      - configMap:
          name: app-config
          items:
          - key: log_level
            path: config/log_level
