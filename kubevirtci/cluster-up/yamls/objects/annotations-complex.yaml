   apiVersion: v1
   kind: Pod
   metadata:                                                                 
      name: annotations-complex                                               
      annotations:                                                            
         deployment-config: |
           {"strategy": "rolling", "maxSurge": 1, "maxUnavailable": 0}
         description: "This pod runs the main web frontend. Contact: team-     
          frontend@example.com"                                                       
         prometheus.io/scrape: "true"                                          
         prometheus.io/port: "9090"                                            
   spec:                                                                     
      containers:                                                             
      - name: nginx                                                           
        image: nginx:1.14.2                                                   
        ports:                                                                
        - containerPort: 80     
