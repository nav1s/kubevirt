apiVersion: apps/v1                                                       
kind: Deployment                                                          
metadata:                                                                 
  name: web-app-2                                                         
  labels:                                                                 
    app.kubernetes.io/name: web-app                                       
    app.kubernetes.io/instance: web-app-002                               
    app.kubernetes.io/version: "1.0.0"                                    
    app.kubernetes.io/component: server                                   
    app.kubernetes.io/managed-by: kubectl                                 
spec:                                                                     
  replicas: 1                                                             
  selector:                                                               
    matchLabels:                                                          
      app.kubernetes.io/name: web-app                                     
      app.kubernetes.io/instance: web-app-002                             
  template:                                                               
    metadata:                                                             
      labels:                                                             
        app.kubernetes.io/name: web-app                                   
        app.kubernetes.io/instance: web-app-002                           
        app.kubernetes.io/version: "1.0.0"                                
        app.kubernetes.io/component: server                               
        app.kubernetes.io/managed-by: kubectl                             
    spec:                                                                 
      containers:                                                         
      - name: nginx                                                       
        image: nginx:1.27
        ports:                                                            
        - containerPort: 80   
