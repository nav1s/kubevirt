apiVersion: v1
kind: Pod
metadata:
  name: configmap-env-pod
spec:
  containers:
    - name: demo
      image: busybox
      command: ["sh", "-c", "echo Lives=$PLAYER_INITIAL_LIVES && echo File=$UI_PROPERTIES_FILE_NAME && sleep 3600"]
      env:
        - name: PLAYER_INITIAL_LIVES
          valueFrom:
            configMapKeyRef:
              name: game-demo
              key: player_initial_lives
        - name: UI_PROPERTIES_FILE_NAME
          valueFrom:
            configMapKeyRef:
              name: game-demo
              key: ui_properties_file_name
  restartPolicy: Never

