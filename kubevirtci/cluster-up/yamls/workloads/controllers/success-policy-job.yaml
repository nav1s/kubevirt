apiVersion: batch/v1
kind: Job
metadata:
  name: success-policy-job
spec:
  completions: 10
  parallelism: 10
  completionMode: Indexed
  successPolicy:
    rules:
    - succeededIndexes: "0"
      succeededCount: 1
  template:
    spec:
      containers:
      - name: main
        image: python:3.11-slim
        command:
        - python3
        - -c
        - |
          import os, sys, time
          index = int(os.environ.get("JOB_COMPLETION_INDEX"))
          if index == 0:
            print("Leader index completed successfully")
            sys.exit(0)
          else:
            time.sleep(30)
            sys.exit(1)
      restartPolicy: Never
